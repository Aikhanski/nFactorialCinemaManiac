[project]
name = "kinomaniac"
version = "0.1.0"
description = "Киноманьяк: подбор фильмов только из переданного каталога"
readme = "README.md"
authors = [
    { name = "Aikhan Khassenov", email = "aikhan.khassenov@tele2.kz" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.57.0",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
